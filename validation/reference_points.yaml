# Reference points: VW 1.9 TDI ALH 90 PS (Golf IV / Jetta / New Beetle, 1997-2003)
# Sources:
#   - Factory ratings: 66 kW (90 PS) @ 3750 rpm, 210 Nm @ 1900 rpm (VW SSP, ETKA)
#   - BSFC island ~197-210 g/kWh near peak torque (TDIClub BSFC chart for ALH, DBW)
#   - Full-load BSFC at rated power ~230-240 g/kWh (typical for this engine class)
# Targets are given as tolerances (pct) around reference values where the
# simulator is expected to land after calibration (Faza 1 in TODO.md).
# NA points are run without turbo coupling; boost points assume --turbo.
points:
  - name: full_load_peak_torque
    description: "Full load at peak torque (factory 210 Nm @ 1900 rpm, turbocharged)"
    rpm: 1900
    fuel_mg_per_cycle_per_cyl: 36.0   # ~smoke limiter max at this rpm
    turbo: true
    soi_offset_deg: -3.0   # factory static timing adj: SOC ~-7 deg BTDC (map gives -7.3, needs a few deg lead for full-load burn)
    known_gap: turbo_coupling   # current turbo balance yields ~0.94 bar intake (see docs/validation_report.md)
    expect:
      # 210 Nm is the literature peak (smoke-limit IQ ~38-40 mg + ~1800 mbar);
      # at the factory map point (1705 mbar, 36 mg) the engine delivers ~190 Nm.
      brake_torque_nm: {ref: 192.0, tol_pct: 10}
      peak_pressure_pa: {ref: 11500000.0, tol_pct: 15}  # ~115 bar typical full-load DI diesel (Heywood Ch. 2; ALH ~110-130 bar)
      bsfc_g_per_kwh: {ref: 210.0, tol_pct: 12}

  - name: full_load_rated_power
    description: "Full load at rated power (factory 66 kW @ 3750 rpm, turbocharged)"
    rpm: 3750
    fuel_mg_per_cycle_per_cyl: 34.0   # full-load IQ near smoke limiter (~36.5 mg at 3750)
    turbo: true
    soi_offset_deg: 0.0   # SOI map already advances with rpm; extra lead hurts here
    known_gap: turbo_coupling
    expect:
      brake_power_kw: {ref: 66.0, tol_pct: 12}
      bsfc_g_per_kwh: {ref: 235.0, tol_pct: 12}

  - name: part_load_cruise
    description: "Part load typical CHP/cruise point (~30 Nm @ 1500 rpm)"
    rpm: 1500
    fuel_mg_per_cycle_per_cyl: 8.0
    turbo: false
    expect:
      imep_bar: {ref: 3.0, tol_pct: 25}   # part-load IMEP is calibration-sensitive
      bsfc_g_per_kwh: {ref: 260.0, tol_pct: 25}
