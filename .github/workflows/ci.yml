name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Quality gates (docs/WORKFLOW.md section 4)
        run: |
          python -m virtual_tdi --help
          python -c "import virtual_tdi"
          python -m virtual_tdi --mode full --rpm 1500 --fuel diesel --fuel-mg 20 --out /tmp/ci_smoke --no-plot
