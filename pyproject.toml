[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-tdi"
version = "0.2.0"
description = "White-box 0D simulator of the VW 1.9 TDI engine (full 720-degree cycle, ECU maps, VP37 hydraulics, turbo coupling, MVEM transient)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "coolprop>=6.6",
    "fluids>=1.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=3.6",
    "hyperopt>=0.2",
    "sympy>=1.13",
    "numdifftools>=0.9",
    "plotly>=5.24",
]

[tool.setuptools]
packages = ["virtual_tdi"]
